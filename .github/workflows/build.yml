name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter create --platforms=android --project-name khoroch_hisab app_tmp
          cp -r lib pubspec.yaml app_tmp/
          sed -i 's/android:label="[^"]*"/android:label="Khoroch Hisab"/' app_tmp/android/app/src/main/AndroidManifest.xml
          cd app_tmp && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: khoroch-hisab-apk
          path: app_tmp/build/app/outputs/flutter-apk/app-release.apk
